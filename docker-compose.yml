# docker-compose.yml


services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: surgimart_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://surgi:${DB_PASSWORD}@postgres:5432/surgimart
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID}
      SANITY_API_TOKEN: ${SANITY_API_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${NEXT_PUBLIC_ALGOLIA_APP_ID}
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${NEXT_PUBLIC_ALGOLIA_SEARCH_KEY}
      ALGOLIA_ADMIN_KEY: ${ALGOLIA_ADMIN_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [surgimart_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: surgimart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: surgi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: surgimart
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks: [surgimart_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgi -d surgimart"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: surgimart_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [surgimart_net]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: surgimart_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on: [app]
    networks: [surgimart_net]

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  surgimart_net:
    driver: bridge
