services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: surgimart_app_dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      DATABASE_URL: postgresql://surgi:${DB_PASSWORD}@postgres:5432/surgimart
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: surgimart_postgres_dev
    environment:
      POSTGRES_USER: surgi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: surgimart
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgi -d surgimart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surgimart_redis_dev
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sanity:
    image: node:20-alpine
    container_name: surgimart_sanity_dev
    working_dir: /app/sanity
    volumes:
      - .:/app
    ports:
      - "3334:3333"
    command: npx sanity dev --port 3333 --host 0.0.0.0
    environment:
      - SANITY_STUDIO_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID}
      - SANITY_STUDIO_DATASET=${NEXT_PUBLIC_SANITY_DATASET}
